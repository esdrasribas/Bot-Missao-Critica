services:
  missaocriticabot:
    container_name: missao-critica-bot
    image: missao-critica-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HTTP_PROXY=${HTTP_PROXY}
        - HTTPS_PROXY=${HTTPS_PROXY}
    environment:
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=localhost,127.0.0.1
    volumes:
      - ./missaoCriticaBot:/app
      - ./.env:/app/.env
    restart: always
